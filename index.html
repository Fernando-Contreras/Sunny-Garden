<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny Garden</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='%23ffc926' stroke='%233a1a2a' stroke-width='1' stroke-linejoin='round'><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(0 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(36 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(72 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(108 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(144 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(180 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(216 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(252 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(288 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(324 16 16)'/></g><circle cx='16' cy='16' r='5.5' fill='%236b3b1c' stroke='%233a1a2a' stroke-width='1'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sun: #b9771a;
    --sun-light: #fbe8b8;
    --sun-pale: #fffaec;
    --stem: #5c7a5c;
    --ink: #2a1f1f;
    --ink-soft: #6b5555;
    --ink-faint: #c4aeae;
    --parchment: #fdf8f2;
    --parchment-dark: #f0e8dc;
    --gold: #c9934a;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
  }

  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  #s-landing {
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 2rem;
    background: var(--parchment);
    position: relative;
    overflow: hidden;
  }
  #s-landing::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, #f5dde388 0%, transparent 70%);
    pointer-events: none;
  }
  .landing-sun {
    font-size: 4rem;
    margin-bottom: 1.5rem;
    animation: sway 4s ease-in-out infinite;
  }
  @keyframes sway {
    0%,100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
  }
  .landing-title {
    font-family: 'Lora', serif;
    font-size: 2.4rem;
    font-weight: 400;
    color: var(--sun);
    line-height: 1.2;
    margin-bottom: 0.75rem;
  }
  .landing-sub {
    font-size: 1rem;
    color: var(--ink-soft);
    line-height: 1.7;
    max-width: 320px;
    margin: 0 auto 2.5rem;
    font-style: italic;
  }
  .name-group {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 1.25rem;
  }
  .name-group label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    text-align: left;
  }
  .name-group input {
    width: 100%;
    padding: 0.85rem 1.1rem;
    border: 1.5px solid var(--ink-faint);
    border-radius: 12px;
    background: white;
    font-family: 'Lora', serif;
    font-size: 1.05rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .name-group input:focus { border-color: var(--sun); }
  .btn-sun {
    background: var(--sun);
    color: white;
    border: none;
    padding: 0.9rem 2.5rem;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    letter-spacing: 0.02em;
  }
  .btn-sun:hover { background: #9a6114; transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid var(--ink-faint);
    padding: 0.75rem 2rem;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.2s;
    margin-top: 0.75rem;
  }
  .btn-ghost:hover { border-color: var(--sun); color: var(--sun); }

  #s-home {
    background: var(--parchment);
    padding: 0;
  }
  .home-header {
    padding: 2rem 1.5rem 1rem;
    border-bottom: 1px solid var(--parchment-dark);
  }
  .home-greeting {
    font-size: 0.8rem;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }
  .home-name {
    font-family: 'Lora', serif;
    font-size: 1.6rem;
    color: var(--ink);
  }
  .question-card {
    margin: 1.5rem;
    background: white;
    border-radius: 20px;
    padding: 1.75rem;
    border: 1px solid var(--sun-light);
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '🌻';
    position: absolute;
    top: -12px; right: -8px;
    font-size: 4rem;
    opacity: 0.12;
    transform: rotate(15deg);
  }
  .question-date {
    font-size: 0.75rem;
    color: var(--sun);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    font-weight: 500;
  }
  .question-text {
    font-family: 'Lora', serif;
    font-size: 1.15rem;
    line-height: 1.6;
    color: var(--ink);
    font-style: italic;
    margin-bottom: 1.5rem;
  }
  .answer-area {
    width: 100%;
    border: 1.5px solid var(--parchment-dark);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    font-family: 'Lora', serif;
    font-size: 1rem;
    color: var(--ink);
    background: var(--parchment);
    resize: none;
    outline: none;
    min-height: 100px;
    line-height: 1.7;
    transition: border-color 0.2s;
  }
  .answer-area:focus { border-color: var(--sun); background: white; }
  .submit-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 1rem;
  }
  .share-section {
    margin: 0 1.5rem 1.5rem;
    background: var(--parchment-dark);
    border-radius: 16px;
    padding: 1.25rem;
  }
  .share-label {
    font-size: 0.75rem;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  .share-link {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: white;
    border: 1px solid var(--ink-faint);
    border-radius: 10px;
    padding: 0.6rem 0.75rem;
  }
  .share-link span {
    flex: 1;
    font-size: 0.8rem;
    color: var(--sun);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: monospace;
  }
  .copy-btn {
    background: var(--sun);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 0.35rem 0.75rem;
    font-size: 0.78rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .nav-bar {
    display: flex;
    border-top: 1px solid var(--parchment-dark);
    background: white;
    position: sticky;
    bottom: 0;
  }
  .nav-item {
    flex: 1;
    padding: 0.85rem;
    text-align: center;
    cursor: pointer;
    font-size: 0.75rem;
    color: var(--ink-faint);
    transition: color 0.15s;
    border: none;
    background: none;
    font-family: 'DM Sans', sans-serif;
  }
  .nav-item.active, .nav-item:hover { color: var(--sun); }
  .nav-icon { font-size: 1.3rem; display: block; margin-bottom: 2px; }

  #s-garden { background: var(--parchment); padding-bottom: 80px; }
  .garden-header {
    padding: 2rem 1.5rem 1rem;
    font-family: 'Lora', serif;
    font-size: 1.5rem;
    color: var(--ink);
  }
  .garden-scene {
    position: relative;
    margin: 0 1.5rem 1rem;
    border-radius: 18px;
    overflow: hidden;
    border: 2px solid #4a2b3d;
    box-shadow: 0 6px 18px rgba(90,50,70,0.25);
    background: #f3b9cb;
    line-height: 0;
  }
  .garden-scene svg { display: block; width: 100%; height: auto; }
  .garden-scene .cloud { animation: drift 16s ease-in-out infinite; }
  @keyframes drift {
    0%,100% { transform: translateX(-10px); }
    50%     { transform: translateX(14px); }
  }
  .garden-scene .sun-rays { animation: spin 70s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .garden-scene .twinkle {
    transform-box: fill-box; transform-origin: center;
    animation: twinkle 3.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.15; transform: scale(0.6); }
    50%     { opacity: 1;    transform: scale(1.1); }
  }
  .garden-scene .bfly { animation: bflyMove 16s ease-in-out infinite; }
  @keyframes bflyMove {
    0%,100% { transform: translate(40px,72px); }
    25%     { transform: translate(140px,52px); }
    50%     { transform: translate(250px,92px); }
    75%     { transform: translate(160px,124px); }
  }
  .garden-scene .flap {
    transform-box: fill-box; transform-origin: center;
    animation: flap 0.45s ease-in-out infinite alternate;
  }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(0.3); } }
  .garden-scene .flower { cursor: pointer; outline: none; }
  .garden-scene .flower-sway {
    transform-box: fill-box; transform-origin: 50% 100%;
    animation: flowerSway 4.5s ease-in-out infinite;
  }
  @keyframes flowerSway {
    0%,100% { transform: rotate(-2.5deg); }
    50%     { transform: rotate(2.5deg); }
  }
  .garden-scene .flower-pop {
    transform-box: fill-box; transform-origin: 50% 100%;
    transition: transform 0.25s;
  }
  .garden-scene .flower.selected .flower-pop { transform: scale(1.22); }
  .garden-scene .flower-glow { opacity: 0.45; animation: glowPulse 3.5s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.65; } }
  .garden-scene .flower:hover .flower-glow,
  .garden-scene .flower:focus-visible .flower-glow { opacity: 0.9; animation: none; }
  .garden-scene .flower.selected .flower-glow { opacity: 1; animation: none; }
  .garden-hint {
    position: absolute; left: 0; right: 0; bottom: 12px;
    text-align: center; font-family: 'Lora', serif; font-size: 0.85rem; line-height: 1.3;
    color: #fff8ec; font-style: italic;
    text-shadow: 0 1px 3px rgba(60,30,50,0.7);
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .garden-scene * { animation: none !important; }
  }
  .flower-detail {
    display: none;
    margin: 0 1.5rem 1rem;
    background: white;
    border-radius: 16px;
    padding: 1.25rem;
    border-left: 3px solid var(--sun);
  }
  .flower-detail.show { display: block; }
  .entry-card {
    margin: 0 1.5rem 1rem;
    background: white;
    border-radius: 16px;
    padding: 1.25rem;
    border-left: 3px solid var(--sun);
  }
  .entry-card-date {
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-bottom: 0.35rem;
    letter-spacing: 0.05em;
  }
  .entry-card-q {
    font-size: 0.85rem;
    color: var(--sun);
    font-style: italic;
    margin-bottom: 0.5rem;
  }
  .entry-card-a {
    font-family: 'Lora', serif;
    font-size: 1rem;
    line-height: 1.65;
    color: var(--ink);
  }
  .empty-garden {
    text-align: center;
    padding: 3rem 2rem;
    color: var(--ink-soft);
    font-style: italic;
    font-family: 'Lora', serif;
  }

  #s-read { background: var(--parchment); padding-bottom: 80px; }
  .read-header {
    padding: 2rem 1.5rem 1rem;
    text-align: center;
  }
  .read-owner {
    font-family: 'Lora', serif;
    font-size: 1.4rem;
    color: var(--sun);
    margin-bottom: 0.25rem;
  }
  .read-sub {
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .toast {
    position: fixed;
    bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: white;
    padding: 0.6rem 1.25rem;
    border-radius: 100px;
    font-size: 0.85rem;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .notif-banner {
    margin: 0 1.5rem 1rem;
    background: #fff8e6;
    border: 1px solid #f0d080;
    border-radius: 14px;
    padding: 1rem 1.1rem;
    font-size: 0.85rem;
    color: #7a5c00;
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
  }
</style>
</head>
<body>

<div class="screen active" id="s-landing">
  <div class="landing-sun">🌻</div>
  <h1 class="landing-title">Sunny Garden</h1>
  <p class="landing-sub">A quiet place to notice beauty.<br>No likes. No comments. Just sunflowers.</p>
  <div class="name-group">
    <label>Your name or nickname</label>
    <input type="text" id="input-name" placeholder="e.g. Meli, Sunny, Sadie..." maxlength="30">
  </div>
  <button class="btn-sun" onclick="startJourney()">Plant my garden 🌱</button>
  <br>
  <button class="btn-ghost" onclick="showReadPrompt()">Read someone's garden →</button>
</div>

<div class="screen" id="s-home">
  <div class="home-header">
    <div class="home-greeting">Good day,</div>
    <div class="home-name" id="home-name-display"></div>
  </div>

  <div id="notif-area"></div>

  <div class="question-card">
    <div class="question-date" id="q-date"></div>
    <div class="question-text" id="q-text"></div>
    <textarea class="answer-area" id="answer-input" placeholder="Write freely, like talking to a trusted friend..."></textarea>
    <div class="submit-row">
      <button class="btn-sun" id="submit-btn" onclick="submitAnswer()">Leave this sunflower 🌻</button>
    </div>
  </div>

  <div class="share-section">
    <div class="share-label">Your garden link — share with loved ones</div>
    <div class="share-link">
      <span id="share-url-display"></span>
      <button class="copy-btn" onclick="copyLink()">Copy</button>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-item active" onclick="showScreen('s-home',this)">
      <span class="nav-icon">🏡</span>Today
    </button>
    <button class="nav-item" onclick="showScreen('s-garden',this)">
      <span class="nav-icon">📖</span>My sunflowers
    </button>
  </nav>
</div>

<div class="screen" id="s-garden">
  <div class="garden-header">My garden 🌻</div>
  <div class="garden-scene" id="garden-scene"></div>
  <div class="flower-detail" id="garden-detail"></div>
  <div id="entries-list"></div>
  <nav class="nav-bar">
    <button class="nav-item" onclick="showScreen('s-home',this)">
      <span class="nav-icon">🏡</span>Today
    </button>
    <button class="nav-item active" onclick="showScreen('s-garden',this)">
      <span class="nav-icon">📖</span>My sunflowers
    </button>
  </nav>
</div>

<div class="screen" id="s-read">
  <div class="read-header">
    <div class="read-owner" id="read-owner-name"></div>
    <div class="read-sub">their sunflowers 🌻</div>
  </div>
  <div class="garden-scene" id="read-scene"></div>
  <div class="flower-detail" id="read-detail"></div>
  <div id="read-entries-list"></div>
  <div style="text-align:center; padding: 1.5rem;">
    <p style="font-size:0.85rem; color:var(--ink-soft); font-style:italic; margin-bottom:1rem;">
      If something moves you, reach out to them directly. 💌
    </p>
    <button class="btn-ghost" onclick="goToMyGarden()">Back to my garden</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const QUESTIONS = [
  "Did you find a little sunshine today? Tell me — what was it, and where did it appear?",
  "What small thing made you pause today, even for just a moment?",
  "If today had a scent, what would it be?",
  "What's something you noticed today that you almost walked past without seeing?",
  "Did anything make you smile when no one was watching?",
  "What texture did today feel like?",
  "Was there a moment of unexpected quiet today? What was in it?",
  "What's one thing you're grateful for that you haven't told anyone?",
  "If you could bottle one moment from today, which would it be?",
  "What made you feel like yourself today?",
  "Did anything remind you of someone you love?",
  "What's the most honest thing you felt today?",
  "Where did you find softness today?",
  "Did the light do anything beautiful today?",
  "What conversation — even a small one — stayed with you?",
];

let state = {
  userName: null,
  userId: null,
  entries: [],
  notifGranted: false,
};

// Storage keys keep the old 'rose_' prefix so existing gardens survive the rename.
function getStorageKey(uid) { return 'rose_garden_' + uid; }

function loadState(uid) {
  try {
    const raw = localStorage.getItem(getStorageKey(uid));
    return raw ? JSON.parse(raw) : { entries: [] };
  } catch(e) { return { entries: [] }; }
}

function saveState(uid, data) {
  try { localStorage.setItem(getStorageKey(uid), JSON.stringify(data)); } catch(e) {}
}

function makeUserId(name) {
  return name.toLowerCase().replace(/[^a-z0-9]/g,'') + '_' + Math.random().toString(36).slice(2,8);
}

function getOrCreateUserId(name) {
  let uid = localStorage.getItem('rose_uid');
  let uname = localStorage.getItem('rose_uname');
  if (uid && uname) return { uid, name: uname };
  uid = makeUserId(name);
  localStorage.setItem('rose_uid', uid);
  localStorage.setItem('rose_uname', name);
  return { uid, name };
}

function startJourney() {
  const nameInput = document.getElementById('input-name').value.trim();
  if (!nameInput) { showToast('Write your name first 🌱'); return; }
  const { uid, name } = getOrCreateUserId(nameInput);
  state.userName = name;
  state.userId = uid;
  state.entries = loadState(uid).entries || [];
  showHome();
}

function showHome() {
  document.getElementById('home-name-display').textContent = state.userName;
  const today = new Date();
  const dateStr = today.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  document.getElementById('q-date').textContent = dateStr;
  const qIndex = Math.abs(hashDay(today)) % QUESTIONS.length;
  document.getElementById('q-text').textContent = QUESTIONS[qIndex];
  const shareUrl = buildShareUrl();
  document.getElementById('share-url-display').textContent = shareUrl;

  const todayKey = today.toISOString().slice(0,10);
  const alreadyAnswered = state.entries.find(e => e.date === todayKey);
  if (alreadyAnswered) {
    document.getElementById('answer-input').value = alreadyAnswered.answer;
    document.getElementById('submit-btn').textContent = '✓ Sunflower left today';
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('submit-btn').style.background = 'var(--stem)';
  }

  askNotifPermission();
  showScreen('s-home', document.querySelector('.nav-item'));
}

function hashDay(date) {
  const s = date.toISOString().slice(0,10);
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return h;
}

function buildShareUrl() {
  const base = window.location.href.split('?')[0];
  return base + '?garden=' + state.userId + '&owner=' + encodeURIComponent(state.userName);
}

function copyLink() {
  const url = buildShareUrl();
  navigator.clipboard.writeText(url).then(() => showToast('Link copied! 🌸'));
}

function submitAnswer() {
  const answer = document.getElementById('answer-input').value.trim();
  if (!answer) { showToast('Write something first...'); return; }
  const today = new Date().toISOString().slice(0,10);
  const q = document.getElementById('q-text').textContent;
  const entry = { date: today, question: q, answer };
  state.entries = state.entries.filter(e => e.date !== today);
  state.entries.unshift(entry);
  saveState(state.userId, { entries: state.entries });
  document.getElementById('submit-btn').textContent = '✓ Sunflower left today';
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('submit-btn').style.background = 'var(--stem)';
  showToast('Your sunflower is planted 🌻');
}

const INK = '#3a1a2a';
const FLOWER_COLORS = [
  ['#ffd23f', '#f2a516', '#6b3b1c'],
  ['#ffe680', '#f6c445', '#7a4a24'],
  ['#ffb22e', '#e5801a', '#5a2f14'],
  ['#fff0a0', '#f7d25a', '#8a5a2a'],
];

function sceneRand(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function flowerDef(p) {
  let back = '', front = '', seeds = '';
  for (let k = 0; k < 14; k++) {
    back += `<path d="M0 -8 C-5 -12 -4.5 -19 0 -24 C4.5 -19 5 -12 0 -8Z" transform="rotate(${k * 360 / 14})" style="fill:var(--p2)" stroke-width="1.2"/>`;
    front += `<path d="M0 -8 C-4 -11 -3.5 -16 0 -20 C3.5 -16 4 -11 0 -8Z" transform="rotate(${(k + 0.5) * 360 / 14})" style="fill:var(--p1)" stroke-width="1.1"/>`;
  }
  for (let k = 1; k < 16; k++) {
    const a = k * 2.39996, r = 1.9 * Math.sqrt(k);
    seeds += `<circle cx="${(r * Math.cos(a)).toFixed(1)}" cy="${(r * Math.sin(a)).toFixed(1)}" r="0.9" fill="#2a1409" stroke="none"/>`;
  }
  return `<g id="${p}flower">
    <path d="M0 0 C-3 -16 3 -34 0 -48" fill="none" stroke="${INK}" stroke-width="5.4" stroke-linecap="round"/>
    <path d="M0 0 C-3 -16 3 -34 0 -48" fill="none" stroke="#3f7a4c" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M0 -12 C-14 -21 -23 -13 -20 -5 C-13 -5 -5 -7 0 -12Z" fill="#5e9a5a" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M0 -27 C14 -36 23 -28 20 -20 C13 -20 5 -22 0 -27Z" fill="#6fae64" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>
    <g transform="translate(0 -52)" stroke="${INK}" stroke-linejoin="round" stroke-linecap="round">
      ${back}${front}
      <circle r="9" style="fill:var(--p3)" stroke-width="1.6"/>
      <circle r="5.2" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
      ${seeds}
      <path d="M-6.5 -3.5 C-5 -6.5 -2.5 -7.8 0 -8" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.3"/>
    </g>
  </g>`;
}

function renderScene(entries, sceneId, detailId) {
  const scene = document.getElementById(sceneId);
  const detail = document.getElementById(detailId);
  detail.classList.remove('show');
  const p = sceneId + '-';
  const oldest = entries.slice().reverse();
  const perRow = 5;
  const rows = Math.max(1, Math.ceil(oldest.length / perRow));
  const W = 340;
  const H = Math.max(300, 200 + rows * 70);
  const hz = Math.round(H * 0.38);

  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A garden of sunflowers">`;
  s += `<defs>
    <linearGradient id="${p}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a99bd8"/><stop offset="0.45" stop-color="#f3b9cb"/><stop offset="1" stop-color="#fde6c4"/></linearGradient>
    <radialGradient id="${p}sunglow"><stop offset="0" stop-color="#fff6d6" stop-opacity="0.95"/><stop offset="0.35" stop-color="#fdd9b0" stop-opacity="0.45"/><stop offset="1" stop-color="#fdd9b0" stop-opacity="0"/></radialGradient>
    <linearGradient id="${p}far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a9dc"/><stop offset="1" stop-color="#e9c9dc"/></linearGradient>
    <linearGradient id="${p}mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8d9a8"/><stop offset="1" stop-color="#7fb686"/></linearGradient>
    <linearGradient id="${p}meadow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d48f"/><stop offset="0.5" stop-color="#63a06c"/><stop offset="1" stop-color="#3d7853"/></linearGradient>
    <linearGradient id="${p}mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="${p}glow"><stop offset="0" stop-color="#fff2b0" stop-opacity="0.95"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="${p}vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#4a1f3c" stop-opacity="0"/><stop offset="1" stop-color="#4a1f3c" stop-opacity="0.4"/></radialGradient>
    <filter id="${p}grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/><feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.22 0"/></filter>
    ${flowerDef(p)}
  </defs>`;

  // Sky, sun, rays
  const sx = 250, sy = hz - 62;
  s += `<rect width="${W}" height="${H}" fill="url(#${p}sky)"/>`;
  s += `<circle cx="${sx}" cy="${sy}" r="120" fill="url(#${p}sunglow)"/>`;
  s += `<g class="sun-rays" style="transform-origin:${sx}px ${sy}px" fill="#fff3c8" opacity="0.35">`;
  for (let i = 0; i < 12; i++) s += `<polygon points="-3,-32 3,-32 0,-78" transform="translate(${sx} ${sy}) rotate(${i * 30})"/>`;
  s += `</g><circle cx="${sx}" cy="${sy}" r="19" fill="#fff8dd"/>`;

  // Clouds
  const cloud = (x, y, sc, d) => `<g transform="translate(${x} ${y}) scale(${sc})"><g class="cloud" style="animation-delay:-${d}s">
    <ellipse cx="0" cy="4" rx="30" ry="8" fill="#f6c6d4" opacity="0.8"/>
    <g fill="#fff7ee" opacity="0.95"><ellipse cx="0" cy="0" rx="28" ry="9"/><ellipse cx="-14" cy="-6" rx="14" ry="10"/><ellipse cx="6" cy="-10" rx="16" ry="12"/><ellipse cx="20" cy="-4" rx="12" ry="8"/></g></g></g>`;
  s += cloud(70, hz * 0.32, 1.1, 3) + cloud(165, hz * 0.55, 0.8, 9) + cloud(300, hz * 0.22, 0.7, 6);

  // Sparkles
  const star = 'M0 -4 C0.6 -1 1 -0.6 4 0 C1 0.6 0.6 1 0 4 C-0.6 1 -1 0.6 -4 0 C-1 -0.6 -0.6 -1 0 -4Z';
  for (let i = 0; i < 18; i++) {
    const x = sceneRand(i + 1) * W, y = sceneRand(i + 50) * (H * 0.92), sc = 0.7 + sceneRand(i + 90) * 0.9;
    s += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(2)})"><path class="twinkle" d="${star}" fill="#fff6c9" style="animation-delay:-${(sceneRand(i + 7) * 3.4).toFixed(2)}s;animation-duration:${(2.6 + sceneRand(i + 11) * 2).toFixed(1)}s"/></g>`;
  }

  // Hills, mist, meadow
  s += `<path d="M0 ${hz + 6} C60 ${hz - 26} 110 ${hz - 12} 170 ${hz - 20} C230 ${hz - 28} 290 ${hz - 6} ${W} ${hz - 14} L${W} ${hz + 40} L0 ${hz + 40}Z" fill="url(#${p}far)"/>`;
  s += `<path d="M0 ${hz + 14} C50 ${hz - 8} 120 ${hz + 2} 190 ${hz - 6} C250 ${hz - 12} 300 ${hz + 8} ${W} ${hz + 2} L${W} ${H} L0 ${H}Z" fill="url(#${p}mid)"/>`;
  for (let i = 0; i < 8; i++) {
    const x = 18 + i * 44 + sceneRand(i + 200) * 14, y = hz + 2 + sceneRand(i + 210) * 10, r = 7 + sceneRand(i + 220) * 5;
    s += `<g fill="#79ab83" opacity="0.8"><rect x="${(x - 1).toFixed(1)}" y="${y.toFixed(1)}" width="2" height="7"/><ellipse cx="${x.toFixed(1)}" cy="${(y - 2).toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r * 1.1).toFixed(1)}"/></g>`;
  }
  s += `<rect x="0" y="${hz - 12}" width="${W}" height="44" fill="url(#${p}mist)"/>`;
  s += `<path d="M0 ${hz + 28} C70 ${hz + 14} 140 ${hz + 30} 210 ${hz + 20} C270 ${hz + 12} 310 ${hz + 24} ${W} ${hz + 18} L${W} ${H} L0 ${H}Z" fill="url(#${p}meadow)"/>`;
  s += `<g fill="#d3ecaa" opacity="0.3"><ellipse cx="70" cy="${hz + 60}" rx="60" ry="9"/><ellipse cx="250" cy="${hz + 90}" rx="70" ry="10"/><ellipse cx="150" cy="${H - 50}" rx="80" ry="10"/></g>`;

  // Foreground items, drawn back-to-front
  const items = [];
  const meadowTop = hz + 40;
  for (let i = 0; i < 24; i++) {
    const x = sceneRand(i + 300) * W, y = meadowTop + sceneRand(i + 330) * (H - meadowTop - 4);
    const sc = 0.6 + 0.7 * ((y - hz) / (H - hz));
    items.push({ y, svg: `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(2)})" fill="#3f8a55" stroke="${INK}" stroke-width="1" stroke-linejoin="round"><path d="M-6 0 C-7 -8 -5 -14 -8 -20 C-2 -14 -2 -7 0 0Z"/><path d="M-1 0 C-2 -12 0 -20 2 -26 C4 -19 3 -10 4 0Z"/><path d="M3 0 C5 -8 8 -13 12 -17 C9 -10 8 -5 8 0Z"/></g>` });
  }
  for (let i = 0; i < 7; i++) {
    const x = 14 + sceneRand(i + 400) * (W - 28), y = meadowTop + 14 + sceneRand(i + 430) * (H - meadowTop - 30);
    const sc = 0.7 + 0.6 * ((y - hz) / (H - hz));
    let petals = '';
    for (let k = 0; k < 6; k++) petals += `<ellipse cx="0" cy="-4" rx="2" ry="3.6" transform="rotate(${k * 60})"/>`;
    items.push({ y, svg: `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(2)})"><path d="M0 0 C1 -6 -1 -10 0 -14" fill="none" stroke="#2f6a45" stroke-width="1.3"/><g transform="translate(0 -14)" fill="#fffaf0" stroke="${INK}" stroke-width="0.8">${petals}<circle r="2.2" fill="#f6c344"/></g></g>` });
  }
  const top = hz + 74, bottom = H - 34;
  oldest.forEach((e, i) => {
    const row = Math.floor(i / perRow), col = i % perRow;
    const frac = rows > 1 ? row / (rows - 1) : 0.5;
    const x = 40 + col * (260 / (perRow - 1)) + (row % 2 ? 16 : 0) + (sceneRand(i + 500) * 14 - 7);
    const y = top + frac * (bottom - top) + (sceneRand(i + 530) * 8 - 4);
    const sc = 0.8 + 0.35 * frac;
    const c = FLOWER_COLORS[i % FLOWER_COLORS.length];
    items.push({ y, svg: `<g class="flower" data-i="${i}" tabindex="0" role="button" aria-label="Sunflower from ${formatDate(e.date)}" transform="translate(${Math.min(x, W - 24).toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(2)})"><g class="flower-sway" style="animation-delay:-${((i % 5) * 0.9).toFixed(1)}s"><g class="flower-pop"><ellipse cx="0" cy="1" rx="12" ry="3" fill="#2b4a36" opacity="0.35"/><circle class="flower-glow" cx="0" cy="-52" r="34" fill="url(#${p}glow)"/><use href="#${p}flower" style="--p1:${c[0]};--p2:${c[1]};--p3:${c[2]}"/><circle cx="0" cy="-52" r="28" fill="transparent"/></g></g></g>` });
  });
  items.sort((a, b) => a.y - b.y).forEach(it => { s += it.svg; });

  // Butterfly
  s += `<g class="bfly"><g class="flap"><path d="M0 0 C-5 -9 -13 -8 -11 -1 C-13 6 -5 7 0 1Z" fill="#8fb8ff" stroke="${INK}" stroke-width="1"/><path d="M0 0 C5 -9 13 -8 11 -1 C13 6 5 7 0 1Z" fill="#b39cff" stroke="${INK}" stroke-width="1"/></g><path d="M0 -4 L0 5" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/></g>`;

  // Paper frame, vignette, grain
  s += `<rect width="${W}" height="${H}" fill="url(#${p}vig)"/>`;
  s += `<rect width="${W}" height="${H}" filter="url(#${p}grain)" style="mix-blend-mode:multiply" pointer-events="none"/>`;
  s += `<rect x="6" y="6" width="${W - 12}" height="${H - 12}" rx="12" fill="none" stroke="#fff3dc" stroke-opacity="0.7" stroke-width="1.2" pointer-events="none"/>`;
  s += `</svg>`;
  s += `<div class="garden-hint">${oldest.length ? 'Tap a sunflower to read it' : 'Your garden is waiting for its first sunflower'}</div>`;
  scene.innerHTML = s;

  scene.querySelectorAll('.flower').forEach(g => {
    const e = oldest[+g.dataset.i];
    const open = () => {
      scene.querySelectorAll('.flower').forEach(r => r.classList.remove('selected'));
      g.classList.add('selected');
      detail.innerHTML = '';
      const dt = document.createElement('div'); dt.className = 'entry-card-date'; dt.textContent = formatDate(e.date);
      const q = document.createElement('div'); q.className = 'entry-card-q'; q.textContent = e.question;
      const a = document.createElement('div'); a.className = 'entry-card-a'; a.textContent = e.answer;
      detail.append(dt, q, a);
      detail.classList.add('show');
      detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    g.addEventListener('click', open);
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); } });
  });
}

function showGarden() {
  renderScene(state.entries, 'garden-scene', 'garden-detail');
  const list = document.getElementById('entries-list');
  if (!state.entries.length) {
    list.innerHTML = '<div class="empty-garden">No sunflowers yet...<br>Answer today\'s question to plant your first 🌱</div>';
  } else {
    list.innerHTML = state.entries.map(e => `
      <div class="entry-card">
        <div class="entry-card-date">${formatDate(e.date)}</div>
        <div class="entry-card-q">${e.question}</div>
        <div class="entry-card-a">${e.answer}</div>
      </div>`).join('');
  }
}

function formatDate(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

function showScreen(id, navBtn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (navBtn) navBtn.classList.add('active');
  if (id === 's-garden') showGarden();
  window.scrollTo(0,0);
}

function showReadPrompt() {
  const uid = prompt('Paste the garden link or just the garden ID:');
  if (!uid) return;
  let gardenId = uid;
  let ownerName = 'their';
  if (uid.includes('garden=')) {
    const u = new URL(uid.includes('http') ? uid : 'https://x.com/?' + uid.split('?')[1]);
    gardenId = u.searchParams.get('garden');
    ownerName = u.searchParams.get('owner') || 'their';
  }
  readGarden(gardenId, ownerName);
}

function readGarden(gardenId, ownerName) {
  const data = loadState(gardenId);
  document.getElementById('read-owner-name').textContent = decodeURIComponent(ownerName) + "'s garden";
  renderScene(data.entries || [], 'read-scene', 'read-detail');
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s-read').classList.add('active');
  const list = document.getElementById('read-entries-list');
  if (!data.entries || !data.entries.length) {
    list.innerHTML = '<div class="empty-garden">No sunflowers here yet...<br>Maybe check back tomorrow 🌱</div>';
  } else {
    list.innerHTML = data.entries.map(e => `
      <div class="entry-card">
        <div class="entry-card-date">${formatDate(e.date)}</div>
        <div class="entry-card-q">${e.question}</div>
        <div class="entry-card-a">${e.answer}</div>
      </div>`).join('');
  }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s-read').classList.add('active');
  window.scrollTo(0,0);
}

function goToMyGarden() {
  if (state.userId) {
    showHome();
  } else {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('s-landing').classList.add('active');
  }
}

function askNotifPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') { scheduleNotif(); return; }
  if (Notification.permission === 'denied') return;
  const area = document.getElementById('notif-area');
  area.innerHTML = `
    <div class="notif-banner">
      🔔 <div>
        <strong>Daily sunflower reminders?</strong><br>
        Get a gentle nudge each day to notice something beautiful.
        <br><button class="btn-sun" style="margin-top:0.6rem; padding:0.45rem 1.2rem; font-size:0.85rem;" onclick="requestNotif()">Yes, remind me</button>
      </div>
    </div>`;
}

function requestNotif() {
  Notification.requestPermission().then(p => {
    document.getElementById('notif-area').innerHTML = '';
    if (p === 'granted') { scheduleNotif(); showToast('Reminders on 🌻'); }
  });
}

function scheduleNotif() {
  if (Notification.permission !== 'granted') return;
  const now = new Date();
  const target = new Date();
  target.setHours(9, 0, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  const delay = target - now;
  setTimeout(() => {
    new Notification('Sunny Garden 🌻', {
      body: 'Did you find a little sunshine today?',
      icon: 'https://cdn.jsdelivr.net/npm/twemoji@14.0.2/assets/svg/1f33b.svg'
    });
    scheduleNotif();
  }, delay);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const garden = params.get('garden');
  const owner = params.get('owner');
  if (garden) {
    readGarden(garden, owner || 'their');
    return;
  }
  const savedUid = localStorage.getItem('rose_uid');
  const savedName = localStorage.getItem('rose_uname');
  if (savedUid && savedName) {
    state.userName = savedName;
    state.userId = savedUid;
    state.entries = loadState(savedUid).entries || [];
    showHome();
  }
});
</script>
</body>
</html>

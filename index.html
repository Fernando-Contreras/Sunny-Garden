<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny Garden</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='%23ffc926' stroke='%233a1a2a' stroke-width='1' stroke-linejoin='round'><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(0 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(36 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(72 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(108 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(144 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(180 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(216 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(252 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(288 16 16)'/><ellipse cx='16' cy='7' rx='3' ry='6' transform='rotate(324 16 16)'/></g><circle cx='16' cy='16' r='5.5' fill='%236b3b1c' stroke='%233a1a2a' stroke-width='1'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sun: #b9771a;
    --sun-light: #fbe8b8;
    --sun-pale: #fffaec;
    --stem: #5c7a5c;
    --ink: #2a1f1f;
    --ink-soft: #6b5555;
    --ink-faint: #c4aeae;
    --parchment: #fdf8f2;
    --parchment-dark: #f0e8dc;
    --gold: #c9934a;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
  }

  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  #s-landing {
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 2rem;
    background: var(--parchment);
    position: relative;
    overflow: hidden;
  }
  #s-landing::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, #f5dde388 0%, transparent 70%);
    pointer-events: none;
  }
  .landing-sun {
    font-size: 4rem;
    margin-bottom: 1.5rem;
    animation: sway 4s ease-in-out infinite;
  }
  @keyframes sway {
    0%,100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
  }
  .landing-title {
    font-family: 'Lora', serif;
    font-size: 2.4rem;
    font-weight: 400;
    color: var(--sun);
    line-height: 1.2;
    margin-bottom: 0.75rem;
  }
  .landing-sub {
    font-size: 1rem;
    color: var(--ink-soft);
    line-height: 1.7;
    max-width: 320px;
    margin: 0 auto 2.5rem;
    font-style: italic;
  }
  .name-group {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 1.25rem;
  }
  .name-group label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    text-align: left;
  }
  .name-group input {
    width: 100%;
    padding: 0.85rem 1.1rem;
    border: 1.5px solid var(--ink-faint);
    border-radius: 12px;
    background: white;
    font-family: 'Lora', serif;
    font-size: 1.05rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .name-group input:focus { border-color: var(--sun); }
  .btn-sun {
    background: var(--sun);
    color: white;
    border: none;
    padding: 0.9rem 2.5rem;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    letter-spacing: 0.02em;
  }
  .btn-sun:hover { background: #9a6114; transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid var(--ink-faint);
    padding: 0.75rem 2rem;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.2s;
    margin-top: 0.75rem;
  }
  .btn-ghost:hover { border-color: var(--sun); color: var(--sun); }

  #s-home {
    background: var(--parchment);
    padding: 0;
  }
  .home-header {
    padding: 2rem 1.5rem 1rem;
    border-bottom: 1px solid var(--parchment-dark);
  }
  .home-greeting {
    font-size: 0.8rem;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }
  .home-name {
    font-family: 'Lora', serif;
    font-size: 1.6rem;
    color: var(--ink);
  }
  .question-card {
    margin: 1.5rem;
    background: white;
    border-radius: 20px;
    padding: 1.75rem;
    border: 1px solid var(--sun-light);
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '🌻';
    position: absolute;
    top: -12px; right: -8px;
    font-size: 4rem;
    opacity: 0.12;
    transform: rotate(15deg);
  }
  .question-date {
    font-size: 0.75rem;
    color: var(--sun);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    font-weight: 500;
  }
  .question-text {
    font-family: 'Lora', serif;
    font-size: 1.15rem;
    line-height: 1.6;
    color: var(--ink);
    font-style: italic;
    margin-bottom: 1.5rem;
  }
  .answer-area {
    width: 100%;
    border: 1.5px solid var(--parchment-dark);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    font-family: 'Lora', serif;
    font-size: 1rem;
    color: var(--ink);
    background: var(--parchment);
    resize: none;
    outline: none;
    min-height: 100px;
    line-height: 1.7;
    transition: border-color 0.2s;
  }
  .answer-area:focus { border-color: var(--sun); background: white; }
  .submit-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 1rem;
  }
  .showcase {
    width: 100%;
    max-width: 420px;
    margin: 2.25rem auto 0;
    text-align: left;
  }
  .showcase[hidden] { display: none; }
  .showcase .garden-scene, .showcase .flower-detail { margin-left: 0; margin-right: 0; }
  .showcase .btn-ghost { display: block; margin: 0.75rem auto 0; }
  .showcase-label {
    font-size: 0.75rem;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    text-align: center;
  }
  .garden-actions { text-align: center; margin: 0 1.5rem 1rem; }
  .garden-actions .btn-ghost { margin: 0.25rem; }
  .share-btn { display: block; margin: 1rem 0 0; font-size: 0.82rem; padding: 0.6rem 1.2rem; }
  .share-btn:disabled { opacity: 0.6; cursor: default; }
  .report-btn {
    display: block;
    margin-top: 0.9rem;
    background: none;
    border: none;
    color: var(--ink-faint);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    text-decoration: underline;
    cursor: pointer;
  }
  .report-btn:hover { color: var(--ink-soft); }
  .nav-bar {
    display: flex;
    border-top: 1px solid var(--parchment-dark);
    background: white;
    position: sticky;
    bottom: 0;
  }
  .nav-item {
    flex: 1;
    padding: 0.85rem;
    text-align: center;
    cursor: pointer;
    font-size: 0.75rem;
    color: var(--ink-faint);
    transition: color 0.15s;
    border: none;
    background: none;
    font-family: 'DM Sans', sans-serif;
  }
  .nav-item.active, .nav-item:hover { color: var(--sun); }
  .nav-icon { font-size: 1.3rem; display: block; margin-bottom: 2px; }

  #s-garden { background: var(--parchment); padding-bottom: 80px; }
  .garden-header {
    padding: 2rem 1.5rem 1rem;
    font-family: 'Lora', serif;
    font-size: 1.5rem;
    color: var(--ink);
  }
  .garden-scene {
    position: relative;
    margin: 0 1.5rem 1rem;
    border-radius: 18px;
    overflow: hidden;
    border: 2px solid #4a2b3d;
    box-shadow: 0 6px 18px rgba(90,50,70,0.25);
    background: #f3b9cb;
    line-height: 0;
  }
  .garden-scene svg { display: block; width: 100%; height: auto; }
  .garden-scene .cloud { animation: drift 16s ease-in-out infinite; }
  @keyframes drift {
    0%,100% { transform: translateX(-10px); }
    50%     { transform: translateX(14px); }
  }
  .garden-scene .sun-rays { animation: spin 70s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .garden-scene .twinkle {
    transform-box: fill-box; transform-origin: center;
    animation: twinkle 3.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.15; transform: scale(0.6); }
    50%     { opacity: 1;    transform: scale(1.1); }
  }
  .garden-scene .bfly { animation: bflyMove 16s ease-in-out infinite; }
  @keyframes bflyMove {
    0%,100% { transform: translate(40px,72px); }
    25%     { transform: translate(140px,52px); }
    50%     { transform: translate(250px,92px); }
    75%     { transform: translate(160px,124px); }
  }
  .garden-scene .flap {
    transform-box: fill-box; transform-origin: center;
    animation: flap 0.45s ease-in-out infinite alternate;
  }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(0.3); } }
  .garden-scene .flower { cursor: pointer; outline: none; }
  .garden-scene .flower-sway {
    transform-box: fill-box; transform-origin: 50% 100%;
    animation: flowerSway 4.5s ease-in-out infinite;
  }
  @keyframes flowerSway {
    0%,100% { transform: rotate(-2.5deg); }
    50%     { transform: rotate(2.5deg); }
  }
  .garden-scene .flower-pop {
    transform-box: fill-box; transform-origin: 50% 100%;
    transition: transform 0.25s;
  }
  .garden-scene .flower.selected .flower-pop { transform: scale(1.22); }
  .garden-scene .flower-glow { opacity: 0.45; animation: glowPulse 3.5s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.65; } }
  .garden-scene .flower.shared .flower-glow { opacity: 0.8; animation: none; }
  .garden-scene .flower:hover .flower-glow,
  .garden-scene .flower:focus-visible .flower-glow { opacity: 0.9; animation: none; }
  .garden-scene .flower.selected .flower-glow { opacity: 1; animation: none; }
  .garden-hint {
    position: absolute; left: 0; right: 0; bottom: 12px;
    text-align: center; font-family: 'Lora', serif; font-size: 0.85rem; line-height: 1.3;
    color: #fff8ec; font-style: italic;
    text-shadow: 0 1px 3px rgba(60,30,50,0.7);
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .garden-scene * { animation: none !important; }
  }
  .flower-detail {
    display: none;
    margin: 0 1.5rem 1rem;
    background: white;
    border-radius: 16px;
    padding: 1.25rem;
    border-left: 3px solid var(--sun);
  }
  .flower-detail.show { display: block; }
  .entry-card {
    margin: 0 1.5rem 1rem;
    background: white;
    border-radius: 16px;
    padding: 1.25rem;
    border-left: 3px solid var(--sun);
  }
  .entry-card-date {
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-bottom: 0.35rem;
    letter-spacing: 0.05em;
  }
  .entry-card-q {
    font-size: 0.85rem;
    color: var(--sun);
    font-style: italic;
    margin-bottom: 0.5rem;
  }
  .entry-card-a {
    font-family: 'Lora', serif;
    font-size: 1rem;
    line-height: 1.65;
    color: var(--ink);
  }
  .empty-garden {
    text-align: center;
    padding: 3rem 2rem;
    color: var(--ink-soft);
    font-style: italic;
    font-family: 'Lora', serif;
  }

  #s-read { background: var(--parchment); padding-bottom: 80px; }
  .read-header {
    padding: 2rem 1.5rem 1rem;
    text-align: center;
  }
  .read-owner {
    font-family: 'Lora', serif;
    font-size: 1.4rem;
    color: var(--sun);
    margin-bottom: 0.25rem;
  }
  .read-sub {
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .toast {
    position: fixed;
    bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: white;
    padding: 0.6rem 1.25rem;
    border-radius: 100px;
    font-size: 0.85rem;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .notif-banner {
    margin: 0 1.5rem 1rem;
    background: #fff8e6;
    border: 1px solid #f0d080;
    border-radius: 14px;
    padding: 1rem 1.1rem;
    font-size: 0.85rem;
    color: #7a5c00;
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
  }
</style>
</head>
<body>

<div class="screen active" id="s-landing">
  <div class="landing-sun">🌻</div>
  <h1 class="landing-title">Sunny Garden</h1>
  <p class="landing-sub">A quiet place to notice beauty.<br>No likes. No comments. Just sunflowers.</p>
  <div class="name-group">
    <label>Your name or nickname</label>
    <input type="text" id="input-name" placeholder="e.g. Meli, Sonny, Sadie..." maxlength="30">
  </div>
  <button class="btn-sun" onclick="startJourney()">Plant my garden 🌱</button>
  <div class="showcase" id="showcase" hidden>
    <div class="showcase-label">A garden from someone, somewhere 🌻</div>
    <div class="garden-scene" id="showcase-scene"></div>
    <div class="flower-detail" id="showcase-detail"></div>
    <button class="btn-ghost" onclick="loadShowcase()">Visit another garden</button>
  </div>
</div>

<div class="screen" id="s-home">
  <div class="home-header">
    <div class="home-greeting">Good day,</div>
    <div class="home-name" id="home-name-display"></div>
  </div>

  <div id="notif-area"></div>

  <div class="question-card">
    <div class="question-date" id="q-date"></div>
    <div class="question-text" id="q-text"></div>
    <textarea class="answer-area" id="answer-input" placeholder="Write freely, like talking to a trusted friend..."></textarea>
    <div class="submit-row">
      <button class="btn-sun" id="submit-btn" onclick="submitAnswer()">Leave this sunflower 🌻</button>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-item active" onclick="showScreen('s-home',this)">
      <span class="nav-icon">🏡</span>Today
    </button>
    <button class="nav-item" onclick="showScreen('s-garden',this)">
      <span class="nav-icon">📖</span>My sunflowers
    </button>
  </nav>
</div>

<div class="screen" id="s-garden">
  <div class="garden-header">My garden 🌻</div>
  <div class="garden-scene" id="garden-scene"></div>
  <div class="flower-detail" id="garden-detail"></div>
  <div class="garden-actions">
    <button class="btn-ghost" onclick="showRandomGarden()">Visit another garden</button>
    <button class="btn-ghost" id="unshare-all-btn" onclick="unshareAll()" hidden>Stop sharing everything</button>
  </div>
  <div id="entries-list"></div>
  <nav class="nav-bar">
    <button class="nav-item" onclick="showScreen('s-home',this)">
      <span class="nav-icon">🏡</span>Today
    </button>
    <button class="nav-item active" onclick="showScreen('s-garden',this)">
      <span class="nav-icon">📖</span>My sunflowers
    </button>
  </nav>
</div>

<div class="screen" id="s-read">
  <div class="read-header">
    <div class="read-owner">A garden from someone</div>
    <div class="read-sub">shared anonymously 🌻</div>
  </div>
  <div class="garden-scene" id="read-scene"></div>
  <div class="flower-detail" id="read-detail"></div>
  <div style="text-align:center; padding: 1.5rem;">
    <p style="font-size:0.85rem; color:var(--ink-soft); font-style:italic; margin-bottom:1rem;">
      Someone chose to share these. Thank you for reading them. 💛
    </p>
    <button class="btn-ghost" onclick="showRandomGarden()">Visit another garden</button><br>
    <button class="btn-ghost" onclick="goToMyGarden()">Back to my garden</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const QUESTIONS = [
  "Did you find a little sunshine today? Tell me — what was it, and where did it appear?",
  "What small thing made you pause today, even for just a moment?",
  "If today had a scent, what would it be?",
  "What's something you noticed today that you almost walked past without seeing?",
  "Did anything make you smile when no one was watching?",
  "What texture did today feel like?",
  "Was there a moment of unexpected quiet today? What was in it?",
  "What's one thing you're grateful for that you haven't told anyone?",
  "If you could bottle one moment from today, which would it be?",
  "What made you feel like yourself today?",
  "Did anything remind you of someone you love?",
  "What's the most honest thing you felt today?",
  "Where did you find softness today?",
  "Did the light do anything beautiful today?",
  "What conversation — even a small one — stayed with you?",
];

let state = {
  userName: null,
  userId: null,
  entries: [],
  notifGranted: false,
};

// Storage keys keep the old 'rose_' prefix so existing gardens survive the rename.
function getStorageKey(uid) { return 'rose_garden_' + uid; }

function loadState(uid) {
  try {
    const raw = localStorage.getItem(getStorageKey(uid));
    return raw ? JSON.parse(raw) : { entries: [] };
  } catch(e) { return { entries: [] }; }
}

function saveState(uid, data) {
  try { localStorage.setItem(getStorageKey(uid), JSON.stringify(data)); } catch(e) {}
}

function makeUserId(name) {
  return name.toLowerCase().replace(/[^a-z0-9]/g,'') + '_' + Math.random().toString(36).slice(2,8);
}

function getOrCreateUserId(name) {
  let uid = localStorage.getItem('rose_uid');
  let uname = localStorage.getItem('rose_uname');
  if (uid && uname) return { uid, name: uname };
  uid = makeUserId(name);
  localStorage.setItem('rose_uid', uid);
  localStorage.setItem('rose_uname', name);
  return { uid, name };
}

function startJourney() {
  const nameInput = document.getElementById('input-name').value.trim();
  if (!nameInput) { showToast('Write your name first 🌱'); return; }
  const { uid, name } = getOrCreateUserId(nameInput);
  state.userName = name;
  state.userId = uid;
  state.entries = loadState(uid).entries || [];
  showHome();
}

function showHome() {
  document.getElementById('home-name-display').textContent = state.userName;
  const today = new Date();
  const dateStr = today.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  document.getElementById('q-date').textContent = dateStr;
  const qIndex = Math.abs(hashDay(today)) % QUESTIONS.length;
  document.getElementById('q-text').textContent = QUESTIONS[qIndex];
  const todayKey = localDateKey(today);
  const alreadyAnswered = state.entries.find(e => e.date === todayKey);
  const submitBtn = document.getElementById('submit-btn');
  if (alreadyAnswered) {
    document.getElementById('answer-input').value = alreadyAnswered.answer;
    submitBtn.textContent = '✓ Sunflower left today';
    submitBtn.style.background = 'var(--stem)';
  } else {
    document.getElementById('answer-input').value = '';
    submitBtn.textContent = 'Leave this sunflower 🌻';
    submitBtn.style.background = '';
  }

  askNotifPermission();
  showScreen('s-home', document.querySelector('.nav-item'));
}

// Local calendar day (not UTC), so "today" flips at the user's midnight.
function localDateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function hashDay(date) {
  const s = localDateKey(date);
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return h;
}

async function submitAnswer() {
  const answer = document.getElementById('answer-input').value.trim();
  if (!answer) { showToast('Write something first...'); return; }
  const today = localDateKey(new Date());
  const existing = state.entries.find(e => e.date === today);
  if (existing && existing.answer === answer) { showToast('Already up to date 🌻'); return; }
  const q = document.getElementById('q-text').textContent;
  const entry = existing ? { ...existing, answer } : { date: today, question: q, answer };
  state.entries = state.entries.filter(e => e.date !== today);
  state.entries.unshift(entry);
  saveState(state.userId, { entries: state.entries });
  document.getElementById('submit-btn').textContent = '✓ Sunflower left today';
  document.getElementById('submit-btn').style.background = 'var(--stem)';
  if (!existing) { showToast('Your sunflower is planted 🌻'); return; }
  if (!entry.shared) { showToast('Sunflower updated 🌻'); return; }
  try {
    await rpc('share_entry', { p_key: getShareKey(), p_date: entry.date, p_question: entry.question, p_answer: entry.answer });
    showToast('Updated, and the shared copy too 🌻');
  } catch (err) {
    showToast("Saved here, but couldn't update the shared copy");
  }
}

const INK = '#3a1a2a';
function sceneRand(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function flowerDef(p) {
  let back = '', front = '', seeds = '';
  for (let k = 0; k < 14; k++) {
    back += `<path d="M0 -8 C-5 -12 -4.5 -19 0 -24 C4.5 -19 5 -12 0 -8Z" transform="rotate(${k * 360 / 14})" style="fill:var(--p2)" stroke-width="1.2"/>`;
    front += `<path d="M0 -8 C-4 -11 -3.5 -16 0 -20 C3.5 -16 4 -11 0 -8Z" transform="rotate(${(k + 0.5) * 360 / 14})" style="fill:var(--p1)" stroke-width="1.1"/>`;
  }
  for (let k = 1; k < 16; k++) {
    const a = k * 2.39996, r = 1.9 * Math.sqrt(k);
    seeds += `<circle cx="${(r * Math.cos(a)).toFixed(1)}" cy="${(r * Math.sin(a)).toFixed(1)}" r="0.9" fill="#2a1409" stroke="none"/>`;
  }
  return `<g id="${p}flower">
    <path d="M0 0 C-3 -16 3 -34 0 -48" fill="none" stroke="${INK}" stroke-width="5.4" stroke-linecap="round"/>
    <path d="M0 0 C-3 -16 3 -34 0 -48" fill="none" stroke="#3f7a4c" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M0 -12 C-14 -21 -23 -13 -20 -5 C-13 -5 -5 -7 0 -12Z" fill="#5e9a5a" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M0 -27 C14 -36 23 -28 20 -20 C13 -20 5 -22 0 -27Z" fill="#6fae64" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>
    <g transform="translate(0 -52)" stroke="${INK}" stroke-linejoin="round" stroke-linecap="round">
      ${back}${front}
      <circle r="9" style="fill:var(--p3)" stroke-width="1.6"/>
      <circle r="5.2" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
      ${seeds}
      <path d="M-6.5 -3.5 C-5 -6.5 -2.5 -7.8 0 -8" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.3"/>
    </g>
  </g>`;
}

// Each garden has its own look: sky palette, sun, clouds, hills, flower hues and positions all come from a seed
// (the owner's id for your own garden, the lowest sunflower id for someone else's), so a garden always looks the same.
const SCENE_PALETTES = [
  { sky: ['#a99bd8', '#f3b9cb', '#fde6c4'], glow: ['#fff6d6', '#fdd9b0'], far: ['#b9a9dc', '#e9c9dc'], mid: ['#b8d9a8', '#7fb686'], meadow: ['#a9d48f', '#63a06c', '#3d7853'], cloud: '#f6c6d4' },
  { sky: ['#8ec5e8', '#fbd9a6', '#ffeccc'], glow: ['#fff3c4', '#ffd98a'], far: ['#a8c8e8', '#e3d6c4'], mid: ['#c2dd9a', '#86b872'], meadow: ['#b5d98a', '#6fa862', '#427a4b'], cloud: '#fbd3a8' },
  { sky: ['#6fb4e6', '#b7dcf2', '#f3f1d9'], glow: ['#ffffe6', '#fff0b8'], far: ['#9bc3e0', '#d6e6ea'], mid: ['#b4dc9c', '#78b27a'], meadow: ['#a4d684', '#5fa35f', '#3a7449'], cloud: '#cfe6f5' },
  { sky: ['#6a5aa8', '#d9779a', '#ffc58a'], glow: ['#ffe2b0', '#ffb27a'], far: ['#7d6bb0', '#c98fb3'], mid: ['#8fb98d', '#5f9170'], meadow: ['#86bb78', '#4f8d62', '#32644a'], cloud: '#e9a3b8' },
  { sky: ['#c3d6e8', '#e8dbe4', '#fff2dc'], glow: ['#fffbe8', '#f6e3c2'], far: ['#c3cfe6', '#e6dde6'], mid: ['#c8e0b4', '#93bf8f'], meadow: ['#b9dd9a', '#74ad75', '#4a815a'], cloud: '#ecd9e2' },
];

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

// extra(e, detail, flowerEl), if given, adds controls under the text of an opened sunflower.
function renderScene(entries, sceneId, detailId, extra, seed) {
  const scene = document.getElementById(sceneId);
  const detail = document.getElementById(detailId);
  detail.classList.remove('show');
  const p = sceneId + '-';
  const R = n => sceneRand(n + (seed || 0) % 100003 * 0.618);
  const oldest = entries.slice().reverse();
  const rows = Math.max(1, Math.ceil(oldest.length / 5));
  const W = 340;
  const H = Math.max(300, 200 + rows * 70);
  const hz = Math.round(H * 0.38);
  const pal = SCENE_PALETTES[Math.floor(R(1) * SCENE_PALETTES.length)];
  // Most gardens are golden-yellow; now and then one is a deep orange "autumn" garden.
  const gardenHue = R(2) < 0.2 ? 18 + R(3) * 10 : 36 + R(3) * 16;
  const o = (n, amp) => ((R(n) - 0.5) * amp).toFixed(1);

  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A garden of sunflowers">`;
  s += `<defs>
    <linearGradient id="${p}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.sky[0]}"/><stop offset="0.45" stop-color="${pal.sky[1]}"/><stop offset="1" stop-color="${pal.sky[2]}"/></linearGradient>
    <radialGradient id="${p}sunglow"><stop offset="0" stop-color="${pal.glow[0]}" stop-opacity="0.95"/><stop offset="0.35" stop-color="${pal.glow[1]}" stop-opacity="0.45"/><stop offset="1" stop-color="${pal.glow[1]}" stop-opacity="0"/></radialGradient>
    <linearGradient id="${p}far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.far[0]}"/><stop offset="1" stop-color="${pal.far[1]}"/></linearGradient>
    <linearGradient id="${p}mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.mid[0]}"/><stop offset="1" stop-color="${pal.mid[1]}"/></linearGradient>
    <linearGradient id="${p}meadow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.meadow[0]}"/><stop offset="0.5" stop-color="${pal.meadow[1]}"/><stop offset="1" stop-color="${pal.meadow[2]}"/></linearGradient>
    <linearGradient id="${p}mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="${p}glow"><stop offset="0" stop-color="#fff2b0" stop-opacity="0.95"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="${p}vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#4a1f3c" stop-opacity="0"/><stop offset="1" stop-color="#4a1f3c" stop-opacity="0.4"/></radialGradient>
    <filter id="${p}grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/><feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0.22 0"/></filter>
    ${flowerDef(p)}
  </defs>`;

  // Sky, sun, rays
  const sx = 60 + R(10) * 220, sy = Math.max(40, hz - 44 - R(11) * 40);
  s += `<rect width="${W}" height="${H}" fill="url(#${p}sky)"/>`;
  s += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="120" fill="url(#${p}sunglow)"/>`;
  s += `<g class="sun-rays" style="transform-origin:${sx.toFixed(1)}px ${sy.toFixed(1)}px" fill="#fff3c8" opacity="0.35">`;
  for (let i = 0; i < 12; i++) s += `<polygon points="-3,-32 3,-32 0,-78" transform="translate(${sx.toFixed(1)} ${sy.toFixed(1)}) rotate(${i * 30})"/>`;
  s += `</g><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="19" fill="#fff8dd"/>`;

  // Clouds
  const cloud = (x, y, sc, d) => `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(2)})"><g class="cloud" style="animation-delay:-${d.toFixed(1)}s">
    <ellipse cx="0" cy="4" rx="30" ry="8" fill="${pal.cloud}" opacity="0.8"/>
    <g fill="#fff7ee" opacity="0.95"><ellipse cx="0" cy="0" rx="28" ry="9"/><ellipse cx="-14" cy="-6" rx="14" ry="10"/><ellipse cx="6" cy="-10" rx="16" ry="12"/><ellipse cx="20" cy="-4" rx="12" ry="8"/></g></g></g>`;
  const nClouds = 2 + Math.floor(R(19) * 3);
  for (let j = 0; j < nClouds; j++) s += cloud(30 + R(20 + j) * 280, hz * (0.15 + R(30 + j) * 0.5), 0.7 + R(40 + j) * 0.5, R(50 + j) * 12);

  // Sparkles
  const star = 'M0 -4 C0.6 -1 1 -0.6 4 0 C1 0.6 0.6 1 0 4 C-0.6 1 -1 0.6 -4 0 C-1 -0.6 -0.6 -1 0 -4Z';
  for (let i = 0; i < 18; i++) {
    const x = R(i + 100) * W, y = R(i + 150) * (H * 0.92), sc = 0.7 + R(i + 190) * 0.9;
    s += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(2)})"><path class="twinkle" d="${star}" fill="#fff6c9" style="animation-delay:-${(R(i + 107) * 3.4).toFixed(2)}s;animation-duration:${(2.6 + R(i + 111) * 2).toFixed(1)}s"/></g>`;
  }

  // Hills, mist, meadow
  s += `<path d="M0 ${hz + 6 + +o(60, 16)} C60 ${hz - 26 + +o(61, 18)} 110 ${hz - 12 + +o(62, 18)} 170 ${hz - 20 + +o(63, 18)} C230 ${hz - 28 + +o(64, 18)} 290 ${hz - 6 + +o(65, 18)} ${W} ${hz - 14 + +o(66, 16)} L${W} ${hz + 40} L0 ${hz + 40}Z" fill="url(#${p}far)"/>`;
  s += `<path d="M0 ${hz + 14 + +o(70, 10)} C50 ${hz - 8 + +o(71, 14)} 120 ${hz + 2 + +o(72, 14)} 190 ${hz - 6 + +o(73, 14)} C250 ${hz - 12 + +o(74, 14)} 300 ${hz + 8 + +o(75, 14)} ${W} ${hz + 2 + +o(76, 10)} L${W} ${H} L0 ${H}Z" fill="url(#${p}mid)"/>`;
  const nTrees = 5 + Math.floor(R(80) * 5);
  for (let i = 0; i < nTrees; i++) {
    const x = 14 + R(i + 200) * (W - 28), y = hz + 2 + R(i + 210) * 10, r = 7 + R(i + 220) * 6;
    s += `<g fill="${pal.mid[1]}" opacity="0.8"><rect x="${(x - 1).toFixed(1)}" y="${y.toFixed(1)}" width="2" height="7"/><ellipse cx="${x.toFixed(1)}" cy="${(y - 2).toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r * 1.1).toFixed(1)}"/></g>`;
  }
  s += `<rect x="0" y="${hz - 12}" width="${W}" height="44" fill="url(#${p}mist)"/>`;
  s += `<path d="M0 ${hz + 28 + +o(90, 8)} C70 ${hz + 14 + +o(91, 10)} 140 ${hz + 30 + +o(92, 10)} 210 ${hz + 20 + +o(93, 10)} C270 ${hz + 12 + +o(94, 10)} 310 ${hz + 24 + +o(95, 10)} ${W} ${hz + 18 + +o(96, 8)} L${W} ${H} L0 ${H}Z" fill="url(#${p}meadow)"/>`;
  s += `<g fill="#d3ecaa" opacity="0.3"><ellipse cx="${(40 + R(97) * 80).toFixed(0)}" cy="${hz + 60}" rx="60" ry="9"/><ellipse cx="${(200 + R(98) * 100).toFixed(0)}" cy="${hz + 90}" rx="70" ry="10"/><ellipse cx="${(100 + R(99) * 140).toFixed(0)}" cy="${H - 50}" rx="80" ry="10"/></g>`;

  // Foreground items, drawn back-to-front
  const items = [];
  const meadowTop = hz + 40;
  for (let i = 0; i < 24; i++) {
    const x = R(i + 300) * W, y = meadowTop + R(i + 330) * (H - meadowTop - 4);
    const sc = 0.6 + 0.7 * ((y - hz) / (H - hz));
    items.push({ y, svg: `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(2)})" fill="#3f8a55" stroke="${INK}" stroke-width="1" stroke-linejoin="round"><path d="M-6 0 C-7 -8 -5 -14 -8 -20 C-2 -14 -2 -7 0 0Z"/><path d="M-1 0 C-2 -12 0 -20 2 -26 C4 -19 3 -10 4 0Z"/><path d="M3 0 C5 -8 8 -13 12 -17 C9 -10 8 -5 8 0Z"/></g>` });
  }
  const nDaisies = 4 + Math.floor(R(399) * 6);
  for (let i = 0; i < nDaisies; i++) {
    const x = 14 + R(i + 400) * (W - 28), y = meadowTop + 14 + R(i + 430) * (H - meadowTop - 30);
    const sc = 0.7 + 0.6 * ((y - hz) / (H - hz));
    const petalFill = R(i + 460) < 0.7 ? '#fffaf0' : (R(i + 470) < 0.5 ? '#ffd6e0' : '#e4d6ff');
    let petals = '';
    for (let k = 0; k < 6; k++) petals += `<ellipse cx="0" cy="-4" rx="2" ry="3.6" transform="rotate(${k * 60})"/>`;
    items.push({ y, svg: `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(2)})"><path d="M0 0 C1 -6 -1 -10 0 -14" fill="none" stroke="#2f6a45" stroke-width="1.3"/><g transform="translate(0 -14)" fill="${petalFill}" stroke="${INK}" stroke-width="0.8">${petals}<circle r="2.2" fill="#f6c344"/></g></g>` });
  }

  // Sunflowers: random spots in the meadow (never up in the sky), kept apart from each other.
  const top = hz + 78, bottom = H - 34;
  const placed = [];
  oldest.forEach((e, i) => {
    // Everything about a sunflower comes from its own id (or date), so cutting another one never moves it.
    const ek = e.id != null ? e.id : hashStr(e.date);
    const E = n => R(n + ek * 37);
    let t = 0;
    const draw = () => E(1000 + t++);
    let spot = null, minD = 48;
    for (let tries = 0; tries < 60 && !spot; tries++) {
      const x = 28 + draw() * (W - 56), y = top + draw() * (bottom - top);
      if (placed.every(q => Math.hypot(q.x - x, (q.y - y) * 1.4) >= minD)) spot = { x, y };
      else if (tries % 12 === 11) minD -= 7;
    }
    if (!spot) spot = { x: 28 + draw() * (W - 56), y: top + draw() * (bottom - top) };
    placed.push(spot);
    const frac = (spot.y - top) / (bottom - top);
    const sc = (0.8 + 0.35 * frac) * (0.92 + E(2100) * 0.16);
    const sy2 = sc * (0.92 + E(2200) * 0.2);
    const flip = E(2300) < 0.5 ? -1 : 1;
    const tilt = (E(2400) - 0.5) * 8;
    const hue = gardenHue + (E(2500) - 0.5) * 12;
    const front = `hsl(${hue.toFixed(0)} 100% ${(58 + E(2600) * 10).toFixed(0)}%)`;
    const back = `hsl(${(hue - 6).toFixed(0)} 95% ${(46 + E(2700) * 8).toFixed(0)}%)`;
    const center = `hsl(${(20 + E(2800) * 16).toFixed(0)} 55% ${(18 + E(2900) * 10).toFixed(0)}%)`;
    items.push({ y: spot.y, svg: `<g class="flower${e.shared ? ' shared' : ''}" data-i="${i}" tabindex="0" role="button" aria-label="Sunflower from ${formatDate(e.date)}" transform="translate(${spot.x.toFixed(1)} ${spot.y.toFixed(1)}) rotate(${tilt.toFixed(1)}) scale(${(flip * sc).toFixed(3)} ${sy2.toFixed(3)})"><g class="flower-sway" style="animation-delay:-${((i % 5) * 0.9).toFixed(1)}s"><g class="flower-pop"><ellipse cx="0" cy="1" rx="12" ry="3" fill="#2b4a36" opacity="0.35"/><circle class="flower-glow" cx="0" cy="-52" r="34" fill="url(#${p}glow)"/><use href="#${p}flower" style="--p1:${front};--p2:${back};--p3:${center}"/><circle cx="0" cy="-52" r="28" fill="transparent"/></g></g></g>` });
  });
  items.sort((a, b) => a.y - b.y).forEach(it => { s += it.svg; });

  // Butterfly
  s += `<g class="bfly"><g class="flap"><path d="M0 0 C-5 -9 -13 -8 -11 -1 C-13 6 -5 7 0 1Z" fill="#8fb8ff" stroke="${INK}" stroke-width="1"/><path d="M0 0 C5 -9 13 -8 11 -1 C13 6 5 7 0 1Z" fill="#b39cff" stroke="${INK}" stroke-width="1"/></g><path d="M0 -4 L0 5" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/></g>`;

  // Paper frame, vignette, grain
  s += `<rect width="${W}" height="${H}" fill="url(#${p}vig)" pointer-events="none"/>`;
  s += `<rect width="${W}" height="${H}" filter="url(#${p}grain)" style="mix-blend-mode:multiply" pointer-events="none"/>`;
  s += `<rect x="6" y="6" width="${W - 12}" height="${H - 12}" rx="12" fill="none" stroke="#fff3dc" stroke-opacity="0.7" stroke-width="1.2" pointer-events="none"/>`;
  s += `</svg>`;
  s += `<div class="garden-hint">${oldest.length ? 'Tap a sunflower to read it' : 'Your garden is waiting for its first sunflower'}</div>`;
  scene.innerHTML = s;

  scene.querySelectorAll('.flower').forEach(g => {
    const e = oldest[+g.dataset.i];
    const open = () => {
      scene.querySelectorAll('.flower').forEach(r => r.classList.remove('selected'));
      g.classList.add('selected');
      detail.innerHTML = '';
      const dt = document.createElement('div'); dt.className = 'entry-card-date'; dt.textContent = formatDate(e.date);
      const q = document.createElement('div'); q.className = 'entry-card-q'; q.textContent = e.question;
      const a = document.createElement('div'); a.className = 'entry-card-a'; a.textContent = e.answer;
      detail.append(dt, q, a);
      if (extra) extra(e, detail, g);
      detail.classList.add('show');
      detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    g.addEventListener('click', open);
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); } });
  });
}

const SB_URL = 'https://hikcmyhviwutxfvnkzkq.supabase.co';
// Publishable key: meant to be public. The table has no policies, so only the functions in supabase/sunny_shared.sql are reachable.
const SB_KEY = 'sb_publishable_01-6kugTz_r7RkWTV3y4Aw_EztuPHrs';

// Per-device secret that proves "this is my sunflower" when unsharing. The server only keeps its hash.
function getShareKey() {
  let k = localStorage.getItem('rose_share_key');
  if (!k) {
    k = crypto.randomUUID() + crypto.randomUUID();
    localStorage.setItem('rose_share_key', k);
  }
  return k;
}

async function rpc(fn, args) {
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error(fn + ' failed: ' + r.status);
  const text = await r.text();
  return text ? JSON.parse(text) : null;
}

function shareControls(e, detail, g) {
  const btn = document.createElement('button');
  btn.className = 'btn-ghost share-btn';
  const paint = () => {
    btn.textContent = e.shared ? '✓ Shared anonymously — stop sharing' : 'Share this sunflower anonymously';
    g.classList.toggle('shared', !!e.shared);
  };
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      if (e.shared) {
        await rpc('unshare_entry', { p_key: getShareKey(), p_date: e.date });
        e.shared = false;
        showToast('No longer shared');
      } else {
        if (!confirm('Anyone who visits Sunny Garden may read this sunflower, anonymously: no name, and nothing linking it to you. You can stop sharing it any time, but only from this same browser, so it cannot be undone from another device or a private window.\n\nShare it?')) { btn.disabled = false; return; }
        await rpc('share_entry', { p_key: getShareKey(), p_date: e.date, p_question: e.question, p_answer: e.answer });
        e.shared = true;
        showToast('Shared anonymously 🌻');
      }
      saveState(state.userId, { entries: state.entries });
    } catch (err) {
      showToast("Couldn't reach the garden right now");
    }
    btn.disabled = false;
    paint();
    updateShareTools();
  };
  paint();
  detail.appendChild(btn);

  const cut = document.createElement('button');
  cut.className = 'report-btn';
  cut.textContent = 'Let the bees take it away 🐝';
  cut.onclick = () => takeFlower(e, g, cut);
  detail.appendChild(cut);
}

// Three bees fly in, grab the stem, tug the sunflower out of the ground and carry it off the top.
async function playBeeAnimation(g) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const sway = g.querySelector('.flower-sway');
  sway.style.animation = 'none';
  g.insertAdjacentHTML('beforeend',
    '<ellipse class="cut-hole" cx="0" cy="1" rx="11" ry="3" fill="#2b1d14" opacity="0"/>' + DIRT_SVG +
    beeSvg(-13, -16, 1) + beeSvg(13, -26, -1) + beeSvg(-12, -38, 1));
  const D = 2900;
  const starts = [[-200, -120], [200, -140], [-180, -190]];
  const drift = [10, -12, 8];
  const anims = [];
  g.querySelectorAll('.cut-bee').forEach((bee, i) => {
    const [sx, sy] = starts[i];
    anims.push(bee.animate([
      { transform: `translate(${sx}px,${sy}px)`, offset: 0, easing: 'ease-out' },
      { transform: 'translate(0,0)', offset: 0.3 },
      { transform: 'translate(0,3px)', offset: 0.34 },
      { transform: 'translate(0,-3px)', offset: 0.38 },
      { transform: 'translate(0,2px)', offset: 0.42 },
      { transform: 'translate(0,0)', offset: 0.45, easing: 'ease-in' },
      { transform: `translate(${drift[i]}px,-400px)`, offset: 1 },
    ], { duration: D, fill: 'forwards' }));
    bee.querySelector('.bee-wings').animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(0.25)' }],
      { duration: 70, iterations: Infinity, direction: 'alternate' });
  });
  anims.push(sway.animate([
    { transform: 'none', offset: 0 },
    { transform: 'none', offset: 0.3 },
    { transform: 'rotate(-4deg)', offset: 0.34 },
    { transform: 'rotate(4deg)', offset: 0.38 },
    { transform: 'rotate(-3deg)', offset: 0.42 },
    { transform: 'none', offset: 0.45, easing: 'ease-in' },
    { transform: 'translateY(-400px) rotate(8deg)', offset: 1 },
  ], { duration: D, fill: 'forwards' }));
  anims.push(g.querySelector('.cut-dirt').animate([
    { opacity: 0, transform: 'translateY(0) scale(0.6)', offset: 0 },
    { opacity: 0, transform: 'translateY(0) scale(0.6)', offset: 0.45 },
    { opacity: 1, transform: 'translateY(-6px) scale(1)', offset: 0.5 },
    { opacity: 0, transform: 'translateY(-20px) scale(1.5)', offset: 0.8 },
  ], { duration: D, fill: 'forwards' }));
  anims.push(g.querySelector('.cut-hole').animate(
    [{ opacity: 0, offset: 0 }, { opacity: 0, offset: 0.45 }, { opacity: 0.9, offset: 0.5 }], { duration: D, fill: 'forwards' }));
  await Promise.all(anims.map(a => a.finished));
  await new Promise(r => setTimeout(r, 300));
}

async function takeFlower(e, g, btn) {
  const warn = e.shared ? ' It will also stop being shared.' : '';
  if (!confirm('Let the bees take this sunflower away? It will be gone from your garden for good.' + warn)) return;
  btn.disabled = true;
  if (e.shared) {
    try {
      await rpc('unshare_entry', { p_key: getShareKey(), p_date: e.date });
    } catch (err) {
      btn.disabled = false;
      showToast("Couldn't reach the garden. Try again in a moment");
      return;
    }
  }
  document.getElementById('garden-detail').classList.remove('show');
  await playBeeAnimation(g);
  state.entries = state.entries.filter(x => x !== e);
  saveState(state.userId, { entries: state.entries });
  if (e.date === localDateKey(new Date())) {
    document.getElementById('answer-input').value = '';
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.textContent = 'Leave this sunflower 🌻';
    submitBtn.style.background = '';
  }
  showGarden();
  showToast('The bees took it away 🐝');
}

function reportControl(e, detail, g) {
  const b = document.createElement('button');
  b.className = 'report-btn';
  b.textContent = 'Report this sunflower';
  b.onclick = async () => {
    b.disabled = true;
    try {
      await rpc('report_entry', { p_key: getShareKey(), p_id: e.id });
      detail.classList.remove('show');
      g.style.display = 'none';
      showToast('Thanks for letting us know');
    } catch (err) {
      b.disabled = false;
      showToast("Couldn't send that right now");
    }
  };
  detail.appendChild(b);
}

function updateShareTools() {
  document.getElementById('unshare-all-btn').hidden = !state.entries.some(e => e.shared);
}

async function unshareAll() {
  if (!confirm('Stop sharing all of your sunflowers? They stay in your garden, but nobody else will be able to read them.')) return;
  try {
    await rpc('unshare_all', { p_key: getShareKey() });
    state.entries.forEach(e => { e.shared = false; });
    saveState(state.userId, { entries: state.entries });
    showToast('Nothing is shared now');
    showGarden();
  } catch (err) {
    showToast("Couldn't reach the garden right now");
  }
}

// Sunflower ids of every garden shown so far this visit, so "visit another garden" doesn't repeat one.
let seenIds = [];
let lastGardenIds = [];

// Someone else's garden is seeded by its lowest sunflower id, which never changes.
function gardenSeed(entries) {
  return Math.min(...entries.map(e => e.id));
}

async function fetchRandomGarden() {
  const call = seen => rpc('random_garden', { p_key: localStorage.getItem('rose_share_key'), p_seen: seen });
  let rows = await call(seenIds);
  if (!rows.length && seenIds.length) {
    // Visited them all: start the cycle over, but still skip the garden on screen.
    seenIds = lastGardenIds.slice();
    rows = await call(seenIds);
  }
  const entries = (rows || []).map(x => ({ id: x.id, date: x.date, question: x.question, answer: x.answer }));
  if (entries.length) {
    lastGardenIds = entries.map(e => e.id);
    seenIds = seenIds.concat(lastGardenIds);
  }
  return entries;
}

async function loadShowcase() {
  const box = document.getElementById('showcase');
  try {
    const entries = await fetchRandomGarden();
    if (!entries.length) {
      if (lastGardenIds.length) showToast("That's the only other garden for now 🌻");
      else box.hidden = true;
      return;
    }
    renderScene(entries, 'showcase-scene', 'showcase-detail', reportControl, gardenSeed(entries));
    box.hidden = false;
  } catch (err) {
    if (!lastGardenIds.length) box.hidden = true;
  }
}

async function showRandomGarden() {
  try {
    const entries = await fetchRandomGarden();
    if (!entries.length) {
      showToast(lastGardenIds.length ? "That's the only other garden for now 🌻" : 'No other gardens are shared yet 🌻');
      return;
    }
    renderScene(entries, 'read-scene', 'read-detail', reportControl, gardenSeed(entries));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('s-read').classList.add('active');
    window.scrollTo(0, 0);
  } catch (err) {
    showToast("Couldn't reach the garden right now");
  }
}

function showGarden() {
  renderScene(state.entries, 'garden-scene', 'garden-detail', shareControls, hashStr(state.userId || ''));
  updateShareTools();
  const list = document.getElementById('entries-list');
  if (!state.entries.length) {
    list.innerHTML = '<div class="empty-garden">No sunflowers yet...<br>Answer today\'s question to plant your first 🌱</div>';
  } else {
    list.innerHTML = state.entries.map(e => `
      <div class="entry-card">
        <div class="entry-card-date">${formatDate(e.date)}</div>
        <div class="entry-card-q">${e.question}</div>
        <div class="entry-card-a">${e.answer}</div>
      </div>`).join('');
  }
}

function formatDate(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

function showScreen(id, navBtn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (navBtn) navBtn.classList.add('active');
  if (id === 's-garden') showGarden();
  window.scrollTo(0,0);
}

function goToMyGarden() {
  if (state.userId) {
    showHome();
  } else {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('s-landing').classList.add('active');
  }
}

function askNotifPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') { scheduleNotif(); return; }
  if (Notification.permission === 'denied') return;
  const area = document.getElementById('notif-area');
  area.innerHTML = `
    <div class="notif-banner">
      🔔 <div>
        <strong>Daily sunflower reminders?</strong><br>
        Get a gentle nudge each day to notice something beautiful.
        <br><button class="btn-sun" style="margin-top:0.6rem; padding:0.45rem 1.2rem; font-size:0.85rem;" onclick="requestNotif()">Yes, remind me</button>
      </div>
    </div>`;
}

function requestNotif() {
  Notification.requestPermission().then(p => {
    document.getElementById('notif-area').innerHTML = '';
    if (p === 'granted') { scheduleNotif(); showToast('Reminders on 🌻'); }
  });
}

function scheduleNotif() {
  if (Notification.permission !== 'granted') return;
  const now = new Date();
  const target = new Date();
  target.setHours(9, 0, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  const delay = target - now;
  setTimeout(() => {
    new Notification('Sunny Garden 🌻', {
      body: 'Did you find a little sunshine today?',
      icon: 'https://cdn.jsdelivr.net/npm/twemoji@14.0.2/assets/svg/1f33b.svg'
    });
    scheduleNotif();
  }, delay);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

window.addEventListener('DOMContentLoaded', () => {
  const savedUid = localStorage.getItem('rose_uid');
  const savedName = localStorage.getItem('rose_uname');
  if (savedUid && savedName) {
    state.userName = savedName;
    state.userId = savedUid;
    state.entries = loadState(savedUid).entries || [];
    showHome();
  } else {
    loadShowcase();
  }
});
</script>
